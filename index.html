<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLEEVE — 바이닐 아카이브 & 자켓 디자인</title>
  <meta name="description" content="내가 모은 LP·CD와 직접 만든 자켓 디자인을 기록·전시하는 개인 바이닐 아카이브, SLEEVE.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:wght@400;600&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="container">
    <div class="main-layout">

      <!-- 좌측 사이드바 -->
      <aside class="sidebar" aria-label="사이드바">
        <div class="sidebar__intro">
          <p class="sidebar__site-name">SLEEVE</p>
          <p class="sidebar__tagline">바이닐 아카이브</p>
        </div>
        <hr class="sidebar__divider">
        <div class="sidebar__recent">
          <p class="sidebar__section-label">최근 추가된 앨범</p>
          <ul id="sidebarAlbums" class="sidebar__list">
            <li class="sidebar__list-item sidebar__list-item--loading">불러오는 중&hellip;</li>
          </ul>
        </div>
      </aside>

      <!-- 우측 메인 피드 -->
      <main id="main-content" class="feed">
        <div id="feedPosts">
          <p class="text-muted">불러오는 중&hellip;</p>
        </div>
      </main>

    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="assets/js/components.js"></script>
  <script>
    (async () => {
      const e = SLEEVE.escapeHTML;
      const sidebarEl = document.getElementById('sidebarAlbums');
      const feedEl = document.getElementById('feedPosts');

      const albums = await SLEEVE.loadAlbums();

      // created_at 내림차순 정렬 (문자열 "YYYY-MM-DD" 비교)
      const sorted = albums
        .slice()
        .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));

      /* ---------- 사이드바: 최근 추가된 앨범 최대 5개 ---------- */
      if (sorted.length) {
        sidebarEl.innerHTML = sorted.slice(0, 5).map((a) => `
          <li class="sidebar__list-item">
            <a href="album.html?id=${e(a.id)}" class="sidebar__album-link">
              <img class="sidebar__thumb" data-src="${e(a.cover_path)}" src="assets/img/ui/placeholder.svg" alt="${e(a.title)}" loading="lazy">
              <span class="sidebar__album-info">
                <span class="sidebar__album-title">${e(a.title)}</span>
                <span class="sidebar__album-date">${e(SLEEVE.formatDate(a.created_at))}</span>
              </span>
            </a>
          </li>
        `).join('');
      } else {
        sidebarEl.innerHTML = '<li class="sidebar__list-item text-muted">표시할 음반이 없습니다.</li>';
      }

      /* ---------- 메인 피드: 전체 앨범 포스트 ---------- */
      if (sorted.length) {
        feedEl.innerHTML = sorted.map((a) => {
          // note excerpt: escape 후에 자른다 (엔티티가 중간에 잘리지 않도록 길이 기준은 원본 escape 결과)
          let excerptHTML = '';
          if (a.note && String(a.note).trim()) {
            const safe = e(a.note);
            const truncated = safe.length > 150 ? safe.slice(0, 150) + '&hellip;' : safe;
            excerptHTML = `<p class="post__excerpt">${truncated}</p>`;
          }
          return `
            <article class="post">
              <header class="post__header">
                <h2 class="post__title"><a href="album.html?id=${e(a.id)}">${e(a.title)}</a></h2>
                <p class="post__meta"><span>${e(a.genre)}</span> <span>${e(a.format)}</span> <span>${e(String(a.release_year))}</span></p>
              </header>
              <a href="album.html?id=${e(a.id)}" class="post__cover-link">
                <img class="post__cover" data-src="${e(a.cover_path)}" src="assets/img/ui/placeholder.svg" alt="${e(a.title)} 자켓" loading="lazy">
              </a>
              <div class="post__body">
                ${excerptHTML}
                <a href="album.html?id=${e(a.id)}" class="post__more">자세히 보기 &rarr;</a>
              </div>
            </article>
          `;
        }).join('');
      } else {
        feedEl.innerHTML = '<div class="empty-state"><p>아직 기록된 음반이 없습니다.</p></div>';
      }

      // 동적으로 추가된 이미지에 lazy load 재적용
      if (typeof window.initLazyLoad === 'function') window.initLazyLoad();
    })();
  </script>
</body>
</html>
