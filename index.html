<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLEEVE — 바이닐 아카이브 & 자켓 디자인</title>
  <meta name="description" content="내가 모은 LP·CD와 직접 만든 자켓 디자인을 기록·전시하는 개인 바이닐 아카이브, SLEEVE.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:wght@400;600&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="main-layout">

    <!-- 좌측 사이드바 -->
      <aside class="sidebar" aria-label="사이드바">
        <div class="sidebar__intro">
          <p class="sidebar__site-name">SLEEVE</p>
          <p class="sidebar__tagline">바이닐 아카이브</p>
          <p class="sidebar__desc">내가 모은 LP·CD와 직접 만든 자켓을 기록하는 공간.</p>
          <img class="sidebar__hero-img" src="assets/img/covers/LP.png" alt="LP 레코드" loading="lazy">
        </div>
        <div class="sidebar__recent">
          <p class="sidebar__section-label">최근 추가된 앨범</p>
          <ul id="sidebarAlbums" class="sidebar__list">
            <li class="sidebar__list-item text-muted">불러오는 중&hellip;</li>
          </ul>
        </div>
        <div class="sidebar__cta">
          <a href="collection.html" class="sidebar__cta-link">전체 컬렉션 보기 &rarr;</a>
        </div>
      </aside>

      <!-- 우측 메인 피드 -->
      <main id="main-content" class="feed">
        <div id="feedPosts">
          <p class="text-muted">불러오는 중&hellip;</p>
        </div>
      </main>

  </div>

  <div id="footer-placeholder"></div>

  <script src="assets/js/components.js"></script>
  <script>
    (async () => {
      const e = SLEEVE.escapeHTML;
      const PH = 'assets/img/ui/placeholder.svg';
      const onerr = `this.onerror=null;this.src='${PH}'`;

      const sidebarEl = document.getElementById('sidebarAlbums');
      const feedEl    = document.getElementById('feedPosts');

      // 카드 제목은 한 줄로 통일 — 31자를 넘으면 말줄임표(…)로 잘라
      // 모든 카드의 제목 줄 수(=자켓 시작 y좌표)가 항상 같아지게 한다.
      const TITLE_MAX = 31;
      const truncateTitle = (title) =>
        title.length > TITLE_MAX ? `${title.slice(0, TITLE_MAX)}…` : title;

      const albums = await SLEEVE.loadAlbums();
      const sorted = albums
        .slice()
        .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));

      /* ---------- 사이드바: 최근 7개 ---------- */
      if (sorted.length) {
        sidebarEl.innerHTML = sorted.slice(0, 7).map((a) => {
          return `
          <li class="sidebar__list-item">
            <a href="album.html?id=${e(a.id)}" class="sidebar__album-link">
              <img class="sidebar__thumb"
                   src="${e(a.cover_path)}"
                   alt="${e(a.title)}"
                   onerror="${onerr}"
                   loading="lazy">
              <span class="sidebar__album-info">
                <span class="sidebar__album-title">${e(a.title)}</span>
                <span class="sidebar__album-artist">${e(a.artist)}</span>
                <span class="sidebar__album-meta">${e(a.format)} &middot; ${e(String(a.release_year))}</span>
              </span>
            </a>
          </li>`;
        }).join('');
      } else {
        sidebarEl.innerHTML = '<li class="sidebar__list-item text-muted">표시할 음반이 없습니다.</li>';
      }

      /* ---------- 메인 피드 ---------- */
      if (sorted.length) {
        feedEl.innerHTML = sorted.map((a) => {
          // 감상평 2줄 미리보기 — 칸(p)과 line-clamp 텍스트(span)를 분리해
          // 칸 높이는 항상 2줄로 고정, 넘치는 텍스트만 "…" 처리
          const rawNote = a.note ? String(a.note).trim() : '';
          const excerptHTML = rawNote
            ? `<p class="post__excerpt"><span class="post__excerpt-text">${e(rawNote)}</span></p>`
            : '';

          // 포맷 표기: 데이터의 "Vinyl"을 진열용 약칭 "LP"로 보여준다(데이터 값 자체는 보존)
          const formatLabel = a.format === 'Vinyl' ? 'LP' : a.format;

          return `
            <article class="post">
              <header class="post__header">
                <h2 class="post__title">
                  <a href="album.html?id=${e(a.id)}">${e(truncateTitle(a.title))}</a>
                </h2>
                <p class="post__meta">
                  <span>${e(a.artist)}</span>
                  <span>${e(String(a.release_year))}</span>
                  <span>${e(formatLabel)}</span>
                </p>
              </header>

              <div class="post__cover-wrap">
                <img class="post__cover"
                     src="${e(a.cover_path)}"
                     alt="${e(a.title)} 자켓"
                     onerror="${onerr}"
                     loading="lazy">
              </div>

              <div class="post__body">
                ${excerptHTML}
              </div>
            </article>`;
        }).join('');
      } else {
        feedEl.innerHTML = '<div class="empty-state"><p>아직 기록된 음반이 없습니다.</p></div>';
      }

      if (typeof window.initLazyLoad === 'function') window.initLazyLoad();
    })();
  </script>
</body>
</html>
