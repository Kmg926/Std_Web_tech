name: Lint & Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  lint:
    name: PHP Syntax Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # Fail fast: any syntax error exits non-zero and blocks the deploy job
      - name: Lint PHP files
        run: find htdocs -name "*.php" -print0 | xargs -0 -n1 php -l

  deploy:
    name: FTP Deploy
    needs: lint          # only runs when lint passes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./htdocs/       # source: repo's htdocs/ folder
          server-dir: /htdocs/       # destination on InfinityFree
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
